name: Mettre à jour la liste des véhicules

# Chaque mois, ou à la demande : la liste suit les nouvelles versions des sources officielles.
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Générer la liste
        run: python3 scripts/build_reference.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/reference
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Met à jour la liste des véhicules"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && pushed=yes && break
            sleep $((attempt * 5))
          done
          test "$pushed" = yes

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
