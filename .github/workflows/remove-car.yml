name: Retirer une voiture
run-name: Retrait de ${{ inputs.name }}

# Lancé par le site. Il faut un accès en écriture aux Actions de ce dépôt pour le déclencher.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Nom de la voiture
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Supprimer la fiche et les photos
        env:
          CAR_NAME: ${{ inputs.name }}
        run: python3 scripts/remove_car.py "$CAR_NAME" --comment-file "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer dans le dépôt
        id: save
        env:
          CAR_NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Retire : $CAR_NAME"
            # Chaque voiture a ses propres fichiers : plusieurs demandes peuvent se suivre.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && pushed=yes && break
              sleep $((attempt * 5))
            done
            test "$pushed" = yes
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: remove
    if: needs.remove.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
