name: Publier le site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/build_index.py", "scripts/infobox.py"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Toujours la dernière version : le robot vient peut-être d'ajouter une voiture.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Régénérer l'index (prend en compte les corrections manuelles)
        run: python3 scripts/build_index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
