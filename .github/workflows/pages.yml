name: Publier le site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/build_index.py", "scripts/infobox.py"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_last.outputs.page_url }}
    steps:
      # Toujours la dernière version : le robot vient peut-être d'ajouter une voiture.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Régénérer l'index (prend en compte les corrections manuelles)
        run: python3 scripts/build_index.py
      - name: Forcer le rechargement du style et du code après chaque publication
        run: sed -i "s/__VERSION__/$(git rev-parse --short HEAD)/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub refuse une publication tant que la précédente n'est pas terminée :
      # on patiente et on réessaie plutôt que de laisser le site en retard.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment_retry.outcome == 'failure'
        run: sleep 180
      - id: deployment_last
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
