name: Choisir la photo principale
run-name: Photo de ${{ inputs.slug }}

# Lancé par le site. Il faut un accès en écriture aux Actions de ce dépôt pour le déclencher.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Identifiant de la voiture
        required: true
        type: string
      file:
        description: Photo à mettre en tête
        required: true
        type: string

jobs:
  set-photo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mettre la photo en tête
        env:
          CAR_SLUG: ${{ inputs.slug }}
          PHOTO_FILE: ${{ inputs.file }}
        run: python3 scripts/set_photo.py "$CAR_SLUG" "$PHOTO_FILE"
      - name: Enregistrer dans le dépôt
        id: save
        env:
          CAR_SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Change la photo principale : $CAR_SLUG"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && pushed=yes && break
              sleep $((attempt * 5))
            done
            test "$pushed" = yes
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: set-photo
    if: needs.set-photo.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
