name: Garder le projet Supabase actif

# Les projets gratuits se mettent en pause après une semaine sans activité.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger le projet
        run: |
          curl --silent --output /dev/null --show-error \
            "https://rrdexsaqgzwsqphmrtgk.supabase.co/auth/v1/health" \
            --header "apikey: sb_publishable_zhNyHSEJORbLdKBK8hLlng_3SHFwxO5"
          curl --silent --output /dev/null --show-error \
            "https://rrdexsaqgzwsqphmrtgk.supabase.co/rest/v1/deck_items?select=title&limit=1" \
            --header "apikey: sb_publishable_zhNyHSEJORbLdKBK8hLlng_3SHFwxO5"
